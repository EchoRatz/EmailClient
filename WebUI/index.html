<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='14' height='10' rx='1.5' fill='%238fb0ff'/%3E%3Cpath d='M1.5 4 8 9l6.5-5' fill='none' stroke='%2313161d' stroke-width='1.3'/%3E%3C/svg%3E" />
    <!-- Paint the saved theme before first paint, so a light-mode user never
         sees a dark flash. Same key and fallback as src/theme.js. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme')
          var r = s === 'light' || s === 'dark' ? s
            : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = r
          document.documentElement.style.colorScheme = r
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="flex min-h-dvh flex-col bg-bg font-sans text-fg antialiased">
    <div id="login" class="flex flex-1 items-center justify-center px-4 py-10" hidden></div>

    <div id="app" class="flex min-h-0 flex-1 flex-col" hidden>
      <div class="airmail" aria-hidden="true"></div>
      <div class="grid min-h-0 flex-1 grid-rows-[auto_1fr] md:grid-cols-[13rem_1fr] md:grid-rows-1">
        <aside class="flex flex-wrap items-center gap-x-6 gap-y-3 border-b border-line px-4 py-4 md:flex-col md:items-stretch md:border-b-0 md:border-r">
          <div id="profile" class="relative"></div>
          <nav class="flex gap-1 md:flex-col" aria-label="Main">
            <a href="#/inbox" data-nav="inbox" class="nav-link">Inbox</a>
            <a href="#/compose" data-nav="compose" class="nav-link">Compose</a>
            <a href="#/saved" data-nav="saved" class="nav-link">Saved</a>
          </nav>
        </aside>

        <main id="view" class="min-w-0 px-4 pt-6 pb-20 outline-none md:px-8 md:pb-6" tabindex="-1"></main>
      </div>
    </div>

    <button id="status" type="button" title="Check connection again"
      class="flex flex-wrap items-center gap-x-6 gap-y-1 border-t border-line px-4 py-1.5 text-left font-mono text-xs text-muted hover:bg-surface">
      Checking connection…
    </button>
  </body>
</html>
